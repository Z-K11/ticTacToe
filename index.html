<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ticTacToe</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
    <div class="heading-wrapper">
        <h1>ZK's TicTacToe</h1>
    </div>
    <div class="game">
        <div class="player_1">
            <div class="playerName" id="playerOneName">
                <label for="name">Name:</label>
                <input type="text" id="name" name="playerOneName">
            </div>
            <div class="scoreDisplay" id="playerOneScore">
                <p>Score :</p>
                <p id="playeOneScore"></p>
            </div>
            <div class="startStopButton" id="playerOneStart">
                <button class="startStopButton"">Start</button>
            </div>
        </div>
        <div class="game_Area"></div>
        <div class="player_2">
            <div class="playerName" id="playerTwoName">
                <label for="name2">Name:</label>
                <input type="text" id="name2" name="playerTwoName">
            </div>
            <div class="scoreDisplay" id="playerTwoScore">
                <p>Score :</p>
                <p id="playeTwoScore"></p>
            </div>
            <div class="startStopButton" id="playerTwoStart">
                <button class="startStopButton"">Start</button>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
